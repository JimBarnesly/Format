name: Pi server safety
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  pi-server:
    strategy:
      matrix:
        os: [ubuntu-24.04, ubuntu-24.04-arm]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: sudo apt-get update && sudo apt-get install -y ffmpeg
      - run: npm run verify
      - run: sh -n deployment/pi/setup.sh && python3 -m unittest discover -s deployment/pi -p 'test_*.py'
