services:
  music-browser:
    profiles: ["containerized-browser"]
    build: .
    container_name: gateway-music-browser
    restart: unless-stopped
    network_mode: host
    working_dir: /app
    command: node server.mjs
    user: "1000:1000"
    environment:
      MUSIC_ROOT: /music
      CACHE_DIR: /cache
      DATA_DIR: /data
      LIBRARY_SCAN_INTERVAL_MS: "900000"
      PORT: "4534"
    volumes:
      - ./:/app:ro
      - /home/jake/Music:/music:rw
      - /home/jake/.cache/gateway-music-browser:/cache
      - /home/jake/.local/share/gateway-music-browser:/data

  picard-web:
    image: aandree5/picard-web:latest
    container_name: gateway-picard-web
    restart: unless-stopped
    ports:
      - "192.168.68.60:8086:5000"
    volumes:
      - /home/jake/.local/share/picard-web:/picard-web:rw
      - /home/jake/Music:/music:rw

  picard-automation:
    image: aandree5/picard-web:latest
    container_name: gateway-picard-automation
    restart: unless-stopped
    volumes:
      - /home/jake/.local/share/picard-automation:/picard-web:rw
      - /home/jake/Music:/music:rw
